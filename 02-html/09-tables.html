<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09-Tables</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            thead {
                th {
                    background-color: #ff0000;
                    color: #000;
                    padding: 0.4rem;
                    border: 2px solid #fff9;
                }
            }
            tbody {
                tr {
                    &:nth-child(even) {
                        background-color: #fff3;
                    }
                    td {
                        border: 2px solid #fff9;
                        color: #fff9;
                        font-size: 0.8rem;
                        padding: 0.4rem;
                    }
                }
            }
            tfoot {
                td {
                    background-color: #ff0000;
                    border: 2px solid #fff9;
                    color: #000;
                    padding: 0.4rem;
                    text-align: center;
                }
            }
        }
    </style>
</head>
<body class="html">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M208,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h80a16,16,0,0,0,16-16V88A16,16,0,0,0,208,72Zm0,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h88Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>09-Tables</h1>
            <img src="../src/images/logo-html.png" alt="Html">
            <h3>Creates tables for data display.</h3>
        </header>
        <section>
           <h3 class="subtitle">Example:</h3>
           <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>FullName</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01</td>
                    <td>Homer Simpson</td>
                    <td>Homer@mail.com</td>
                </tr>
                <tr>
                    <td>02</td>
                    <td>Marge Simpson</td>
                    <td>Marge@mail.com</td>
                </tr>
                <tr>
                    <td>03</td>
                    <td>Barth Simpson</td>
                    <td>Barth@mail.com</td>
                </tr>
                <tr>
                    <td>04</td>
                    <td>Lisa Simpson</td>
                    <td>Lisa@mail.com</td>
                </tr>
                <tr>
                    <td>05</td>
                    <td>Maggie Simpson</td>
                    <td>Maggie@mail.com</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Simpson Family</td>
                </tr>
            </tfoot>
           </table>
        </section>
    </main>
</body>
</html>
