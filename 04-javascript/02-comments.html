    <main>
        <header class="mmenu internal">
            <h1>02-Comments</h1>
            <img src="../src/images/logo-js.png" alt="JS">
            <h3>Add comments to explain or annotate your code.</h3>
        </header>
        <section>
            <h3 class="subtitle">Digital Time:</h3>
            <p id="time">00:00:00</p>
        </section>
    </main>
    <script>
        // This is a comment line (only one line)
        // Elements
        const time = document.getElementById('time');

        /* 
           This is a multiple lines comment,
           Is used for explain somenthing or 
           Inactive portion of code. 
        */

        // Apply some styles
        time.style.zoom = '4';
        time.style.textAlign = 'center';

        // Interval Time (1s)
        setInterval(function() {
            const now = new Date;
            time.textContent = `${now.getHours()}:
                                ${now.getMinutes()}:
                                ${now.getSeconds()}`
        }, 1000); // 1 second equals 1000 ms
    </script>
</body>
