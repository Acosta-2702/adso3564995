<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-Text Shadow</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            p.txt {
                font-size: 4rem;
                font-weight: 600;
                margin: 1rem 0;
                text-align: center;

                &.txt1 {
                    color: #000;
                    text-shadow: 0 0 6px white;
                }
                &.txt2 {
                    color: #000;
                    text-shadow: -4px -4px 4px white;
                }
                &.txt3 {
                    font-weight: 900;
                    letter-spacing: 0.4rem;
                    text-shadow: 1px 1px #ccc, 
                                 2px 2px #bbb, 
                                 3px 3px #aaa, 
                                 4px 4px rgba(0, 0, 0, 0.3);
                } 
                &.txt4 {
                    color: #fff;
                    letter-spacing: 0.6rem;
                    text-shadow: -5px 0 0 #fcdd09,
                                 -10px 0 0 #078930;
                }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">

            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>30-Text Shadow</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>Adds shadows to text.</h3>
        </header>
        <section>
            <h2 class="subtitle">Examples:</h2>
            <p class="txt txt1">ADSO</p>
            <p class="txt txt2">C.P.I.C</p>
            <p class="txt txt3">SENA</p>
            <p class="txt txt4">Caldas</p>
        </section>
    </main>
</body>
</html>
