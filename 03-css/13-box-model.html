<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13-Box Model</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        div.box {
            background: #fff url(imgs/box-model.png) no-repeat center /contain;

            /* Border: */

            /* LongWay: width */
            border-top-width: 4px;
            border-right-width: 4px;
            border-bottom-width: 4px;
            border-left-width: 4px;
            
            /* Shorthand: Width */
            border-width: 4px;

            /* LongWay: Style */
            border-top-style: solid;
            border-right-style: solid;
            border-bottom-style: solid;
            border-left-style: solid;

            /* Shorthand: Style */
            border-style: solid;

             /* LongWay: Color */
            border-top-color: #caa0f5;
            border-right-color: #caa0f5;
            border-bottom-color: #caa0f5;
            border-left-color: #caa0f5;

            /* Shorthand: Color */
            border-color: #caa0f5;

            /* Shorthand: Border */
            border: 4px solid #caa0f5;
            
            /* LongWay: Padding */
            padding-top: 0.6rem;
            padding-right: 0.6rem;
            padding-bottom: 0.6rem;
            padding-left: 0.6rem;

            /* Shorthand: Padding */
            padding: 0.6rem; /* Top, Right, Bottom, Left */

            width: 300px;
            height: 200px;
            margin: 2rem auto;
            padding: 0.6rem;
        }
    </style>
</head>
<body class="css">

            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>13-Box Model</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>Is essentially a box that wraps around every html element.</h3>
        </header>

           <div class="box"></div>
        </section>
