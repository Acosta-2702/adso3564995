<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12-Colors Alpha</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section figure {
            background: url(imgs/mario.png) no-repeat center / cover;
            display: flex;
            height: 440px;
            div {
                width: 80px;
                &.box1 { background-color: #fffe; }
                &.box2 { background-color: #fffc; }
                &.box3 { background-color: rgba(255, 255, 255, 0.667); }
                &.box4 { background-color: rgba(255, 255, 255, 0.533); }
                &.box5 { background-color: hsla(0, 0%, 100%, 0.4); }
                &.box6 { background-color: hsla(0, 0%, 100%, 0.267); }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M208,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h80a16,16,0,0,0,16-16V88A16,16,0,0,0,208,72Zm0,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h88Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>12-Colors Alpha</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>The fourth alpha channel allows you to apply opacity or transparency to the color.</h3>
        </header>
        <section>
           <h3 class="subtitle">Example:</h3>
           <figure class="Mario">
            <div class="box1"></div>
            <div class="box2"></div>
            <div class="box3"></div>
            <div class="box4"></div>
            <div class="box5"></div>
            <div class="box6"></div>
           </figure>
        </section>
    </main>
</body>
</html>
