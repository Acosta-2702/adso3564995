<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-Clip Path</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div.clip {
                background: url(imgs/pittsburgh.jpg) no-repeat center /cover;
                margin: 2rem auto;
                height: 240px;
                width: 240px;
                transition: all 0.5s ease;

                &.clip1 {
                    clip-path: circle(25%);

                    &:hover {
                       clip-path: circle(100%); 
                    }
                }
                &.clip2 {
                    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);

                
                  &:hover {
                    clip-path: polygon(50% 0%, 100% 0, 100% 35%, 100% 59%, 100% 100%, 50% 100%, 0 100%, 0 59%, 0 35%, 0 0);
                  }
               }
               &.clip3 {
                  clip-path: polygon(20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%, 50% 70%, 80% 100%, 100% 80%, 70% 50%, 100% 20%, 80% 0%, 50% 30%);

                  &:hover {
                    clip-path: polygon(20% 0%, 0 0, 0 46%, 0 100%, 20% 100%, 51% 100%, 80% 100%, 100% 100%, 100% 53%, 100% 0, 80% 0%, 50% 0);
                  }
               }
            }
        }
    </style>
</head>
<body class="css">
    <nav class="goback">
        <a href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#fff" viewBox="0 0 256 256">
                <path d="M208,72H128V32a8,8,0,0,0-13.66-5.66l-96,96a8,8,0,0,0,0,11.32l96,96A8,8,0,0,0,128,224V184h80a16,16,0,0,0,16-16V88A16,16,0,0,0,208,72Zm0,96H120a8,8,0,0,0-8,8v28.69L35.31,128,112,51.31V80a8,8,0,0,0,8,8h88Z"></path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>32-Clip Path</h1>
            <img src="../src/images/logo-css.png" alt="Css">
            <h3>Property lets you clip an element to a basic shape.</h3>
        </header>
        <section>
           <h3 class="subtitle">Example 01:</h3>
           <div class="clip clip1"></div>
           <h3 class="subtitle">Example 02:</h3>
           <div class="clip clip2"></div> 
           <h3 class="subtitle">Example 03:</h3>
           <div class="clip clip3"></div>
        </section>
    </main>
</body>
</html>
