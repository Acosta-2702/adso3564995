<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-Challenge Grid</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
           display: block;
        }

        .gallery-1,
        .gallery-2 {
            display: grid;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            grid-template-rows: repeat(3, 140px);
        }

        .gallery-1 {
             grid-template-columns: repeat(3, 1fr);
             grid-template-areas:
             "one  two  three"
             "four two  five"
             "six  six  seven";
            }

        .gallery-2 {
             grid-template-columns: repeat(4, 1fr);
             grid-template-areas:
             "one  one  two  three"
             "one  one  four four"
             "five six  four four";
            }

        .gallery-1 div,
        .gallery-2 div {
                background-size: cover;
                background-position: center;
                border: 3px solid #fff;
                border-radius: 10px;
            }

        .one   { grid-area: one; }
        .two   { grid-area: two; }
        .three { grid-area: three; }
        .four  { grid-area: four; }
        .five  { grid-area: five; }
        .six   { grid-area: six; }
        .seven { grid-area: seven; }
    </style>
</head>
<body class="css">

            </svg>

    </nav>
    <main>

        <section>
